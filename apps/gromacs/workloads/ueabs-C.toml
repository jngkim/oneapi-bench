[workload]
title = "PRACE UEABS GROMACS Test Case C: STMV 3x3x3 replica, 28M atoms"
kind = "published"
publisher = "PRACE UEABS 2.2"
reference = "https://repository.prace-ri.eu/git/UEABS/ueabs/-/blob/master/gromacs/README.md"
size = "xlarge"
scaling = "strong"
status = "unvalidated"
description = "27 copies of the satellite tobacco mosaic virus; PME. Intended for multi-node scaling."
notes = "Download is 355 MB. The checksum is not pinned yet: obench fetch prints it on first download."

[[inputs]]
url = "https://repository.prace-ri.eu/ueabs/GROMACS/2.2/GROMACS_TestCaseC.tar.xz"
sha256 = ""

[run]
nodes = [1, 2, 4, 8]
devices_per_node = [1, 2, 4, "max"]
time_limit = "00:45:00"
command = """{exe} mdrun -s {tpr} -nsteps {nsteps} -maxh {maxh} -resethway -noconfout -cpt -1 \\
  -nb {nb} -pme {pme} -bonded {bonded} -update {update} {npme_flag} \\
  -ntomp {ntomp} -pin {pin} -g md.log {extra}"""

[params]
tpr = "{input_dir}/GROMACS_TestCaseC/stmv.28M.tpr"
nsteps = 50000
maxh = 0.5                     # mdrun stops cleanly after 0.99 x maxh hours
pme = "gpu"
bonded = "gpu"
update = "auto"
nb = "gpu"
npme = "auto"                  # "auto": one PME rank when running several ranks
max_threads = 16               # cap on OpenMP threads per rank (-ntomp)
pin = "auto"
extra = ""                     # additional mdrun flags

[metrics]
primary = "ns_per_day"
higher_is_better = true
unit = "ns/day"
