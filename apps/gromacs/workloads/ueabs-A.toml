[workload]
title = "PRACE UEABS GROMACS Test Case A: GluCl ion channel, 142k atoms"
kind = "published"
publisher = "PRACE UEABS 2.2"
reference = "https://repository.prace-ri.eu/git/UEABS/ueabs/-/blob/master/gromacs/README.md"
size = "small"
scaling = "strong"
status = "unvalidated"
description = "Ion channel in a membrane; PME electrostatics. UEABS runs it with -nsteps 50000 -maxh 1.0."
notes = ""

[[inputs]]
url = "https://repository.prace-ri.eu/ueabs/GROMACS/2.2/GROMACS_TestCaseA.tar.xz"
sha256 = "dc9078976a561d0cf1b032fb84f117dc3bfa5567526e68bc58197787c460b08c"

[run]
nodes = [1, 2]
devices_per_node = [1, 2, 4, "max"]
time_limit = "00:45:00"
command = """{exe} mdrun -s {tpr} -nsteps {nsteps} -maxh {maxh} -resethway -noconfout -cpt -1 \\
  -nb {nb} -pme {pme} -bonded {bonded} -update {update} {npme_flag} \\
  -ntomp {ntomp} -pin {pin} -g md.log {extra}"""

[params]
tpr = "{input_dir}/GROMACS_TestCaseA/ion_channel.tpr"
nsteps = 50000
maxh = 0.5                     # mdrun stops cleanly after 0.99 x maxh hours
pme = "gpu"
bonded = "gpu"
update = "auto"
nb = "gpu"
npme = "auto"                  # "auto": one PME rank when running several ranks
max_threads = 16               # cap on OpenMP threads per rank (-ntomp)
pin = "auto"
extra = ""                     # additional mdrun flags

[metrics]
primary = "ns_per_day"
higher_is_better = true
unit = "ns/day"
