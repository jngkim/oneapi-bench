[workload]
title = "benchRIB: ribosome in water, 2M atoms, 4 fs time step"
kind = "published"
publisher = "MPI-NAT Göttingen (Kutzner et al.)"
reference = "https://www.mpinat.mpg.de/grubmueller/bench"
size = "large"
scaling = "strong"
status = "unvalidated"
description = "Large ribosome system from the MPI-NAT benchmark set."
notes = ""

[[inputs]]
url = "https://www.mpinat.mpg.de/benchRIB"
filename = "benchRIB.zip"
sha256 = "39acb014a79ed9a9ff2ad6294a2c09f9b85ea6986dfc204a3639814503eeb60a"

[run]
nodes = [1, 2, 4]
devices_per_node = [1, 2, 4, "max"]
time_limit = "01:00:00"
command = """{exe} mdrun -s {tpr} -nsteps {nsteps} -maxh {maxh} -resethway -noconfout -cpt -1 \\
  -nb {nb} -pme {pme} -bonded {bonded} -update {update} {npme_flag} \\
  -ntomp {ntomp} -pin {pin} -g md.log {extra}"""

[params]
tpr = "{input_dir}/benchRIB.tpr"
nsteps = 10000
maxh = 0.5                     # mdrun stops cleanly after 0.99 x maxh hours
pme = "gpu"
bonded = "gpu"
update = "auto"
nb = "gpu"
npme = "auto"                  # "auto": one PME rank when running several ranks
max_threads = 16               # cap on OpenMP threads per rank (-ntomp)
pin = "auto"
extra = ""                     # additional mdrun flags

[metrics]
primary = "ns_per_day"
higher_is_better = true
unit = "ns/day"
