[workload]
title = "PRACE UEABS GROMACS Test Case B: lignocellulose, 3.3M atoms, reaction field"
kind = "published"
publisher = "PRACE UEABS 2.2"
reference = "https://repository.prace-ri.eu/git/UEABS/ueabs/-/blob/master/gromacs/README.md"
size = "large"
scaling = "strong"
status = "unvalidated"
description = "Cellulose and lignin in water with reaction-field electrostatics (no PME)."
notes = "No PME, so -pme is left to GROMACS (auto) and no PME rank is created."

[[inputs]]
url = "https://repository.prace-ri.eu/ueabs/GROMACS/2.2/GROMACS_TestCaseB.tar.xz"
sha256 = "72978a381225cd6667eeedca638ff2ce6b3b04321b9d70b9f40a419493d1eb83"

[run]
nodes = [1, 2, 4]
devices_per_node = [1, 2, 4, "max"]
time_limit = "00:45:00"
command = """{exe} mdrun -s {tpr} -nsteps {nsteps} -maxh {maxh} -resethway -noconfout -cpt -1 \\
  -nb {nb} -pme {pme} -bonded {bonded} -update {update} {npme_flag} \\
  -ntomp {ntomp} -pin {pin} -g md.log {extra}"""

[params]
tpr = "{input_dir}/GROMACS_TestCaseB/lignocellulose.tpr"
nsteps = 50000
maxh = 0.5                     # mdrun stops cleanly after 0.99 x maxh hours
pme = "auto"
bonded = "gpu"
update = "auto"
nb = "gpu"
npme = "auto"                  # "auto": one PME rank when running several ranks
max_threads = 16               # cap on OpenMP threads per rank (-ntomp)
pin = "auto"
extra = ""                     # additional mdrun flags

[metrics]
primary = "ns_per_day"
higher_is_better = true
unit = "ns/day"
