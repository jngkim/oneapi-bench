[workload]
title = "benchPEP-h: peptides in water, 12M atoms, h-bond constraints"
kind = "published"
publisher = "MPI-NAT Göttingen (Kutzner et al.)"
reference = "https://www.mpinat.mpg.de/grubmueller/bench"
size = "xlarge"
scaling = "strong"
status = "unvalidated"
description = "12M-atom system with h-bond constraints, suited to GPU update (-update gpu)."
notes = "The all-bond variant benchPEP is not included because GPU update is not available for it."

[[inputs]]
url = "https://www.mpinat.mpg.de/benchPEP-h"
filename = "benchPEP-h.zip"
sha256 = "3ca8902fd9a6cf005b266f83b57217397b4ba4af987b97dc01e04185bd098bce"

[run]
nodes = [1, 2, 4, 8]
devices_per_node = [1, 2, 4, "max"]
time_limit = "01:00:00"
command = """{exe} mdrun -s {tpr} -nsteps {nsteps} -maxh {maxh} -resethway -noconfout -cpt -1 \\
  -nb {nb} -pme {pme} -bonded {bonded} -update {update} {npme_flag} \\
  -ntomp {ntomp} -pin {pin} -g md.log {extra}"""

[params]
tpr = "{input_dir}/benchPEP-h.tpr"
nsteps = 5000
maxh = 0.5                     # mdrun stops cleanly after 0.99 x maxh hours
pme = "gpu"
bonded = "gpu"
update = "gpu"
nb = "gpu"
npme = "auto"                  # "auto": one PME rank when running several ranks
max_threads = 16               # cap on OpenMP threads per rank (-ntomp)
pin = "auto"
extra = ""                     # additional mdrun flags

[metrics]
primary = "ns_per_day"
higher_is_better = true
unit = "ns/day"
